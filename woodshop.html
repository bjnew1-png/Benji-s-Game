<!DOCTYPE html>
<html>
<head>
<title>Woodshop Warrior – Level 19 (One‑Click)</title>
<style>
  body { margin:0; background:#2b2b2b; display:flex; justify-content:center; align-items:center; height:100vh; }
  canvas { background:#f7e3c2; box-shadow:0 0 25px rgba(0,0,0,0.7); border:4px solid #5a3b1e; }
</style>
</head>
<body>
<canvas id="game" width="700" height="450"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let project = { x:330, y:200, w:50, h:70, vx:0, vy:0 };
let rage = 0;
let timeLeft = 45;
let last = performance.now();
let keys = {};
let gameOver = false;
let win = false;

const tools = [
  { name:"clamp", x:120, y:90, w:50, h:14, vx:2.2, vy:0 },
  { name:"sander", x:520, y:300, w:70, h:16, vx:-3.0, vy:0 },
  { name:"glue", x:350, y:40, w:35, h:35, vx:0, vy:2.5 }
];

window.addEventListener("keydown", e => keys[e.key] = true);
window.addEventListener("keyup", e => keys[e.key] = false);

function update(dt){
  if(gameOver) return;

  timeLeft -= dt;
  if(timeLeft <= 0){
    gameOver = true;
    win = false;
  }

  const speed = 180;
  project.vx = (keys["ArrowLeft"] ? -speed : keys["ArrowRight"] ? speed : 0);
  project.vy = (keys["ArrowUp"] ? -speed : keys["ArrowDown"] ? speed : 0);

  project.x += project.vx * dt;
  project.y += project.vy * dt;

  const minX = 50, minY = 50, maxX = 650, maxY = 400;
  if(project.x < minX){ project.x = minX; rage += 1.5; }
  if(project.x + project.w > maxX){ project.x = maxX - project.w; rage += 1.5; }
  if(project.y < minY){ project.y = minY; rage += 1.5; }
  if(project.y + project.h > maxY){ project.y = maxY - project.h; rage += 1.5; }

  project.x += Math.sin(performance.now()/250) * 12 * dt;

  for(let t of tools){
    t.x += t.vx;
    t.y += t.vy;

    if(t.x < minX || t.x + t.w > maxX) t.vx *= -1;
    if(t.y < minY || t.y + t.h > maxY) t.vy *= -1;

    if(collide(project, t)){
      rage += 10;
      project.x += (project.x < t.x ? -25 : 25);
      project.y += (project.y < t.y ? -25 : 25);
    }
  }

  if(rage >= 100){
    gameOver = true;
    win = false;
  }

  if(project.x + project.w > 580 && project.y + project.h > 330 && rage < 80){
    gameOver = true;
    win = true;
  }
}

function collide(a,b){
  return a.x < b.x + b.w &&
         a.x + a.w > b.x &&
         a.y < b.y + b.h &&
         a.y + a.h > b.y;
}

function draw(){
  ctx.clearRect(0,0,700,450);

  ctx.fillStyle = "#e8c99a";
  ctx.fillRect(50,50,600,350);

  ctx.fillStyle = "#b7e88f";
  ctx.fillRect(580,330,70,70);
  ctx.fillStyle = "#2f4f1a";
  ctx.font = "16px sans-serif";
  ctx.fillText("FINISH", 595, 365);

  ctx.fillStyle = "#c48a4a";
  ctx.fillRect(project.x, project.y, project.w, project.h);
  ctx.strokeStyle = "#7a4b1c";
  ctx.strokeRect(project.x, project.y, project.w, project.h);

  for(let t of tools){
    if(t.name === "clamp") ctx.fillStyle = "#7f0000";
    if(t.name === "sander") ctx.fillStyle = "#444";
    if(t.name === "glue") ctx.fillStyle = "#ffd54f";
    ctx.fillRect(t.x, t.y, t.w, t.h);
  }

  ctx.fillStyle = "#fff";
  ctx.font = "18px sans-serif";
  ctx.fillText("Rage: " + Math.floor(rage) + "/100", 60, 35);
  ctx.fillText("Time: " + Math.max(0,timeLeft).toFixed(1) + "s", 300, 35);
  ctx.fillText("Woodshop Warrior – Level 19 (Improved)", 60, 440);

  if(gameOver){
    ctx.fillStyle = "rgba(0,0,0,0.6)";
    ctx.fillRect(0,0,700,450);

    ctx.fillStyle = "#fff";
    ctx.font = "32px sans-serif";
    if(win){
      ctx.fillText("YOU MASTERED THE CHAOS!", 150, 200);
      ctx.font = "20px sans-serif";
      ctx.fillText("You kept rage under control and finished the project.", 140, 240);
    } else {
      ctx.fillText("WORKBENCH RAGE OVERLOAD!", 150, 200);
      ctx.font = "20px sans-serif";
      ctx.fillText("The chaos defeated you. Try again.", 210, 240);
    }

    ctx.font = "18px sans-serif";
    ctx.fillText("Refresh the page to restart.", 240, 300);
  }
}

function loop(now){
  let dt = (now - last) / 1000;
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
