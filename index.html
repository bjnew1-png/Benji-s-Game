<!DOCTYPE html>
<html>
<head>
<title>WoodWorkChaos – Complex Maze (Fixed)</title>
<style>
  body {
    margin:0;
    background:#0f0f0f;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:sans-serif;
    color:white;
  }
  canvas {
    background:#d9b47a; /* light wood floor */
    box-shadow:0 0 35px rgba(0,0,0,0.8);
    border:4px solid #4a2b12;
    border-radius:10px;
  }
</style>
</head>
<body>

<canvas id="game" width="1200" height="700"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// ⭐ SMALLER PLAYER (fits through gaps)
let player = { x:120, y:120, w:22, h:32, vx:0, vy:0 };

// ⭐ FINISH IN MIDDLE (now reachable)
const finishZone = { x:560, y:310, w:80, h:80 };

// ⭐ COMPLEX MAZE WALLS (solid, dark color)
const walls = [
  // Outer border
  {x:80, y:80, w:1040, h:20},
  {x:80, y:80, w:20,   h:540},
  {x:1100, y:80, w:20, h:540},
  {x:80, y:600, w:1040, h:20},

  // Maze structure
  {x:160, y:140, w:300, h:20},
  {x:160, y:140, w:20,  h:200},
  {x:440, y:140, w:20,  h:200},

  {x:220, y:260, w:240, h:20},
  {x:220, y:260, w:20,  h:200},
  {x:440, y:260, w:20,  h:200},

  {x:520, y:140, w:360, h:20},
  {x:520, y:140, w:20,  h:200},
  {x:860, y:140, w:20,  h:200},

  {x:580, y:260, w:300, h:20},
  {x:580, y:260, w:20,  h:220},
  {x:860, y:260, w:20,  h:220},

  {x:160, y:380, w:300, h:20},
  {x:160, y:380, w:20,  h:220},
  {x:440, y:380, w:20,  h:220},

  {x:520, y:380, w:360, h:20},
  {x:520, y:380, w:20,  h:220},
  {x:860, y:380, w:20,  h:220},

  // ⭐ CENTER RING — OPENED so finish is reachable
  {x:520, y:320, w:20,  h:160},
  {x:640, y:320, w:20,  h:160},

  // OPEN TOP AND BOTTOM GAPS
  // Removed: {x:520, y:320, w:140, h:20}
  // Removed: {x:520, y:460, w:140, h:20}

  // Dead ends
  {x:260, y:460, w:200, h:20},
  {x:260, y:520, w:20,  h:80},
  {x:760, y:460, w:200, h:20},
  {x:940, y:460, w:20,  h:80}
];

// INPUT
let keys = {};
window.addEventListener("keydown", e => keys[e.key] = true);
window.addEventListener("keyup", e => keys[e.key] = false);

// COLLISION CHECK
function hitsWall(x,y,w,h){
  for(const wall of walls){
    if(x < wall.x + wall.w &&
       x + w > wall.x &&
       y < wall.y + wall.h &&
       y + h > wall.y){
      return true;
    }
  }
  return false;
}

// UPDATE LOOP
function update(dt){
  const speed = 260;

  let vx = (keys["ArrowLeft"] ? -speed : keys["ArrowRight"] ? speed : 0);
  let vy = (keys["ArrowUp"] ? -speed : keys["ArrowDown"] ? speed : 0);

  // Try X movement
  let nextX = player.x + vx * dt;
  if(!hitsWall(nextX, player.y, player.w, player.h)){
    player.x = nextX;
  }

  // Try Y movement
  let nextY = player.y + vy * dt;
  if(!hitsWall(player.x, nextY, player.w, player.h)){
    player.y = nextY;
  }
}

// DRAW LOOP
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // Maze background (floor)
  ctx.fillStyle = "#d9b47a";
  ctx.fillRect(80,80,1040,520);

  // Maze walls (dark brown)
  ctx.fillStyle = "#3b2a18";
  for(const wall of walls){
    ctx.fillRect(wall.x, wall.y, wall.w, wall.h);
  }

  // Finish zone
  ctx.fillStyle = "#8fd48f";
  ctx.fillRect(finishZone.x, finishZone.y, finishZone.w, finishZone.h);
  ctx.fillStyle = "#1f3f1a";
  ctx.font = "22px sans-serif";
  ctx.fillText("FINISH", finishZone.x + 10, finishZone.y + finishZone.h/2);

  // ⭐ Smaller player
  ctx.fillStyle = "#ffcc99";
  ctx.fillRect(player.x, player.y, player.w, player.h);
}

// MAIN LOOP
let last = performance.now();
function loop(now){
  let dt = (now - last) / 1000;
  last = now;

  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>

</body>
</html>
