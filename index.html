<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cube Dash</title>
<style>
    body { margin:0; background:#111; overflow:hidden; }
    canvas { background:#222; display:block; margin:0 auto; }

    #loadingScreen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #000;
        color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 60px;
        font-family: Arial, sans-serif;
        z-index: 9999;
        opacity: 1;
        transition: opacity 1s ease;
    }
</style>
</head>
<body>

<!-- LOADING SCREEN -->
<div id="loadingScreen">
    <h1>Cube Dash</h1>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
canvas.width = 900;
canvas.height = 400;

// LOADING SCREEN FADE
setTimeout(() => {
    const load = document.getElementById("loadingScreen");
    load.style.opacity = 0;
    setTimeout(() => load.style.display = "none", 1000);
}, 2000);

// PLAYER
let player = {
    x: 100,
    y: 300,
    w: 30,
    h: 30,
    dy: 0,
    grounded: true
};

// DEMON
let demon = {
    x: -20,
    y: 300,
    w: 40,
    h: 40,
    speed: 2
};

// OBJECT LIST
let objects = [];

/* ---------------------------------------------------
   RANDOM 2‑SPIKE‑LONG, 1‑SPIKE‑HIGH ROWS
--------------------------------------------------- */

function addTwoSpikeRow(startX) {
    const y = 330; // ground height
    const offset = Math.floor(Math.random() * 300); // random spacing

    objects.push({ x: startX + offset,     y, w: 40, h: 40, type: "spike" });
    objects.push({ x: startX + offset + 40, y, w: 40, h: 40, type: "spike" });
}

// PLACE MULTIPLE RANDOM ROWS
addTwoSpikeRow(1500);
addTwoSpikeRow(2000);
addTwoSpikeRow(2500);
addTwoSpikeRow(3000);
addTwoSpikeRow(3500);
addTwoSpikeRow(4000);

// FINISH LINE
objects.push({ x: 4500, y: 250, w: 20, h: 150, type: "finish" });

/* ---------------------------------------------------
   INPUT
--------------------------------------------------- */

document.addEventListener("keydown", (e) => {
    if (e.code === "Space" && player.grounded) {
        player.dy = -14;   // HIGHER JUMP
        player.grounded = false;
    }
});

/* ---------------------------------------------------
   GAME LOOP
--------------------------------------------------- */

function loop() {

    ctx.clearRect(0,0,canvas.width,canvas.height);

    // Physics
    player.dy += 0.4;   // LONGER JUMP (slower fall)
    player.y += player.dy;

    if (player.y >= 300) {
        player.y = 300;
        player.dy = 0;
        player.grounded = true;
    }

    // Movement (FASTER SPEED)
    player.x += 4;
    demon.x += demon.speed;

    // Camera
    let camX = player.x - 100;

    // Draw player
    ctx.fillStyle = "#4af";
    ctx.fillRect(player.x - camX, player.y, player.w, player.h);

    // Draw demon
    ctx.fillStyle = "#f33";
    ctx.fillRect(demon.x - camX, demon.y, demon.w, demon.h);

    // Draw objects
    objects.forEach(o => {

        // TRIANGLE SPIKES
        if (o.type === "spike") {
            ctx.fillStyle = "#ff0000";
            ctx.beginPath();
            ctx.moveTo(o.x - camX + o.w/2, o.y);
            ctx.lineTo(o.x - camX, o.y + o.h);
            ctx.lineTo(o.x - camX + o.w, o.y + o.h);
            ctx.closePath();
            ctx.fill();

            // Spike collision
            if (player.x < o.x + o.w &&
                player.x + player.w > o.x &&
                player.y + player.h > o.y) {
                demon.speed += 0.1;
                end();
            }

            return;
        }

        // FINISH LINE
        if (o.type === "finish") ctx.fillStyle = "#fff";

        ctx.fillRect(o.x - camX, o.y, o.w, o.h);

        if (o.type === "finish") {
            if (player.x < o.x + o.w &&
                player.x + player.w > o.x &&
                player.y < o.y + o.h &&
                player.y + player.h > o.y) {
                end();
            }
        }
    });

    // Demon catches player
    if (demon.x + demon.w >= player.x) {
        end();
    }

    requestAnimationFrame(loop);
}

function end() {
    location.reload(); // INSTANT RESTART, NO ANIMATION
}

loop();
</script>
</body>
</html>
