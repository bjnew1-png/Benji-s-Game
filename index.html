<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Chase Dash</title>
<style>
    body { margin:0; background:#111; overflow:hidden; }
    canvas { background:#222; display:block; margin:0 auto; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
canvas.width = 900;
canvas.height = 400;

// PLAYER
let player = {
    x: 100,
    y: 300,
    w: 30,
    h: 30,
    dy: 0,
    grounded: true
};

// CHASER (Cube Demon)
let demon = {
    x: 100 - 120,   // stays 12 tiles behind
    y: 300,
    w: 40,
    h: 40,
    speed: 2        // SAME speed as level scroll
};

// LEVEL OBJECTS
let objects = [
    // Section 1 — Warm-up
    {x:300, y:330, w:40, h:40, type:"spike"},
    {x:450, y:330, w:40, h:40, type:"break"},

    // Section 2 — Panic
    {x:650, y:330, w:40, h:10, type:"jumpPad"},
    {x:800, y:330, w:40, h:10, type:"flipPad"},
    {x:950, y:330, w:40, h:80, type:"slowGate"},
    {x:1100, y:330, w:80, h:80, type:"shadow"},

    // Section 3 — Escape Burst
    {x:1300, y:330, w:40, h:10, type:"boost"},
    {x:1500, y:330, w:80, h:10, type:"moving"},
    {x:1700, y:330, w:40, h:40, type:"spike"},
    {x:1800, y:330, w:40, h:40, type:"spike"},

    // Section 4 — Final Stretch
    {x:2000, y:330, w:40, h:40, type:"collapse"},
];

// GAME SPEED
let speed = 2; // slow sprint

// INPUT — SPACE to jump
document.addEventListener("keydown", (e) => {
    if (e.code === "Space" && player.grounded) {
        player.dy = -10;
        player.grounded = false;
    }
});

// GAME LOOP
function loop() {
    ctx.clearRect(0,0,canvas.width,canvas.height);

    // Player physics
    player.dy += 0.5;
    player.y += player.dy;

    if (player.y >= 300) {
        player.y = 300;
        player.dy = 0;
        player.grounded = true;
    }

    // Move level
    objects.forEach(o => o.x -= speed);

    // Demon moves same speed as level
    demon.x += demon.speed;

    // Draw player
    ctx.fillStyle = "#4af";
    ctx.fillRect(player.x, player.y, player.w, player.h);

    // Draw demon
    ctx.fillStyle = "#f33";
    ctx.fillRect(demon.x, demon.y, demon.w, demon.h);

    // Draw objects + interactions
    objects.forEach(o => {
        ctx.fillStyle = "#fff";

        if (o.type === "spike") ctx.fillStyle = "#f00";
        if (o.type === "break") ctx.fillStyle = "#a52";
        if (o.type === "jumpPad") ctx.fillStyle = "#0f0";
        if (o.type === "flipPad") ctx.fillStyle = "#0ff";
        if (o.type === "slowGate") ctx.fillStyle = "#ff0";
        if (o.type === "shadow") ctx.fillStyle = "#333";
        if (o.type === "boost") ctx.fillStyle = "#0f8";
        if (o.type === "moving") ctx.fillStyle = "#888";
        if (o.type === "collapse") ctx.fillStyle = "#555";

        ctx.fillRect(o.x, o.y, o.w, o.h);

        // Collision
        if (player.x < o.x + o.w &&
            player.x + player.w > o.x &&
            player.y < o.y + o.h &&
            player.y + player.h > o.y) {

            if (o.type === "spike") end("You hit a spike!");
            if (o.type === "break") speed = 1.5;
            if (o.type === "jumpPad") player.dy = -14;
            if (o.type === "flipPad") player.dy = -8;
            if (o.type === "slowGate") demon.speed += 0.8;
            if (o.type === "shadow") demon.visible = false;
            if (o.type === "boost") player.x += 40;
            if (o.type === "collapse") speed = 1.8;
        }
    });

    // Demon catches player
    if (demon.x + demon.w >= player.x) {
        end("Cube Demon caught you!");
    }

    requestAnimationFrame(loop);
}

function end(msg) {
    alert(msg);
    location.reload();
}

loop();
</script>
</body>
</html>
