<!DOCTYPE html>
<html>
<head>
<title>Woodshop Warrior – Upgraded 2D</title>
<style>
  body {
    margin:0;
    background:#1b1b1f;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:sans-serif;
  }
  canvas {
    background:linear-gradient(#f7e3c2, #e0c08f);
    box-shadow:0 0 35px rgba(0,0,0,0.8);
    border:4px solid #4a2b12;
    border-radius:10px;
  }
</style>
</head>
<body>
<canvas id="game" width="900" height="550"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let levelIndex = 0;

const corners = [
  { x:70, y:60 },       // top-left
  { x:710, y:60 },      // top-right
  { x:70, y:400 },      // bottom-left
  { x:710, y:400 }      // bottom-right
];

function makeLevel(num){
  const corner = corners[num % 4];
  return {
    name: "Level " + num,
    time: 50 - num * 3,
    rageMax: 100 - num * 2,
    finish: { x: corner.x, y: corner.y, w: 120, h: 80 },
    tools: [
      { name:"clamp", x:140, y:110, w:60, h:16, vx:2+num*0.3, vy:0 },
      { name:"sander", x:560, y:320, w:80, h:18, vx:-2.5-num*0.2, vy:0 },
      { name:"glue", x:380, y:70, w:40, h:40, vx:0, vy:2+num*0.3 },
      { name:"chisel", x:300, y:380, w:50, h:12, vx:2.2+num*0.2, vy:-1.5-num*0.2 },
      { name:"mallet", x:500, y:200, w:40, h:40, vx:-2.5-num*0.2, vy:2.5+num*0.2 }
    ]
  };
}

const levels = [];
for(let i=1;i<=10;i++){
  levels.push(makeLevel(i));
}

let player;
let box;
let tools;
let finishZone;
let rage;
let timeLeft;
let last = performance.now();
let keys = {};
let gameOver = false;
let win = false;
let allCleared = false;

const bounds = { minX:70, minY:60, maxX:830, maxY:480 };

function startLevel(index){
  const lvl = levels[index];

  player = { x:380, y:230, w:40, h:70, vx:0, vy:0 };
  box = { x:420, y:260, w:60, h:60 };

  tools = JSON.parse(JSON.stringify(lvl.tools));
  finishZone = lvl.finish;
  rage = 0;
  timeLeft = lvl.time;
  gameOver = false;
  win = false;
  allCleared = false;
}

startLevel(levelIndex);

window.addEventListener("keydown", e => {
  keys[e.key] = true;
  if(gameOver && e.key === "Enter"){
    if(win && levelIndex < levels.length - 1){
      levelIndex++;
      startLevel(levelIndex);
    } else {
      levelIndex = 0;
      startLevel(levelIndex);
    }
  }
});
window.addEventListener("keyup", e => keys[e.key] = false);

function update(dt){
  if(gameOver) return;

  timeLeft -= dt;
  if(timeLeft <= 0){
    gameOver = true;
    win = false;
  }

  const speed = 200;
  player.vx = (keys["ArrowLeft"] ? -speed : keys["ArrowRight"] ? speed : 0);
  player.vy = (keys["ArrowUp"] ? -speed : keys["ArrowDown"] ? speed : 0);

  player.x += player.vx * dt;
  player.y += player.vy * dt;

  if(player.x < bounds.minX) player.x = bounds.minX;
  if(player.x + player.w > bounds.maxX) player.x = bounds.maxX - player.w;
  if(player.y < bounds.minY) player.y = bounds.minY;
  if(player.y + player.h > bounds.maxY) player.y = bounds.maxY - player.h;

  box.x = player.x + 20;
  box.y = player.y + 30;

  for(let t of tools){
    t.x += t.vx;
    t.y += t.vy;

    if(t.x < bounds.minX || t.x + t.w > bounds.maxX) t.vx *= -1;
    if(t.y < bounds.minY || t.y + t.h > bounds.maxY) t.vy *= -1;

    if(collide(player, t)){
      rage += 10;
      player.x += (player.x < t.x ? -30 : 30);
      player.y += (player.y < t.y ? -30 : 30);
    }
  }

  const lvl = levels[levelIndex];
  if(rage >= lvl.rageMax){
    gameOver = true;
    win = false;
  }

  if(collide(player, finishZone) && rage < lvl.rageMax){
    gameOver = true;
    win = true;
    if(levelIndex === levels.length - 1){
      allCleared = true;
    }
  }
}

function collide(a,b){
  return a.x < b.x + b.w &&
         a.x + a.w > b.x &&
         a.y < b.y + b.h &&
         a.y + a.h > b.y;
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle = "#d9b47a";
  ctx.fillRect(bounds.minX, bounds.minY, bounds.maxX - bounds.minX, bounds.maxY - bounds.minY);

  ctx.fillStyle = "#8fd48f";
  ctx.fillRect(finishZone.x, finishZone.y, finishZone.w, finishZone.h);
  ctx.fillStyle = "#1f3f1a";
  ctx.font = "18px sans-serif";
  ctx.fillText("FINISH", finishZone.x + 20, finishZone.y + finishZone.h/2);

  ctx.save();
  ctx.shadowColor = "rgba(0,0,0,0.5)";
  ctx.shadowBlur = 12;
  ctx.fillStyle = "#ffcc99";
  ctx.fillRect(player.x, player.y, player.w, player.h);
  ctx.restore();

  ctx.fillStyle = "#c48a4a";
  ctx.fillRect(box.x, box.y, box.w, box.h);

  for(let t of tools){
    ctx.save();
    ctx.shadowColor = "rgba(0,0,0,0.4)";
    ctx.shadowBlur = 8;
    if(t.name === "clamp") ctx.fillStyle = "#b00000";
    else if(t.name === "sander") ctx.fillStyle = "#444";
    else if(t.name === "glue") ctx.fillStyle = "#ffd54f";
    else if(t.name === "chisel") ctx.fillStyle = "#c0c0c0";
    else if(t.name === "mallet") ctx.fillStyle = "#5a3b1e";
    ctx.fillRect(t.x, t.y, t.w, t.h);
    ctx.restore();
  }

  ctx.fillStyle = "#ffffff";
  ctx.font = "20px sans-serif";
  ctx.fillText("Rage: " + Math.floor(rage) + "/" + levels[levelIndex].rageMax, 80, 40);
  ctx.fillText("Time: " + Math.max(0,timeLeft).toFixed(1) + "s", 320, 40);
  ctx.fillText(levels[levelIndex].name, 80, 520);

  if(gameOver){
    ctx.fillStyle = "rgba(0,0,0,0.7)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle = "#fff";
    ctx.font = "32px sans-serif";
    if(win){
      if(allCleared){
        ctx.fillText("YOU CLEARED ALL 10 LEVELS!", 200, 250);
      } else {
        ctx.fillText("LEVEL CLEARED!", 300, 250);
        ctx.font = "20px sans-serif";
        ctx.fillText("Press ENTER for next level.", 320, 290);
      }
    } else {
      ctx.fillText("WORKBENCH RAGE OVERLOAD!", 200, 250);
      ctx.font = "20px sans-serif";
      ctx.fillText("Press ENTER to restart.", 320, 290);
    }
  }
}

function loop(now){
  let dt = (now - last) / 1000;
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
