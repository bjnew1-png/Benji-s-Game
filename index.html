<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cube Dash – 10 Levels</title>
<style>
    body { margin:0; background:#111; overflow:hidden; }
    canvas { background:#222; display:block; margin:0 auto; }
    #loadingScreen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #000;
        color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 60px;
        font-family: Arial, sans-serif;
        z-index: 9999;
        opacity: 1;
        transition: opacity 1s ease;
    }
</style>
</head>
<body>

<div id="loadingScreen"><h1>Cube Dash</h1></div>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
canvas.width = 900;
canvas.height = 400;

window.onload = () => {
    setTimeout(() => {
        const load = document.getElementById("loadingScreen");
        load.style.opacity = 0;
        setTimeout(() => load.style.display = "none", 1000);
    }, 1500);
};

let player;
let demon;
let objects = [];
let currentLevel = 0;
let levels = [];

/* ---------------- LEVEL DEFINITIONS ---------------- */

function makeLevel(spikeStart, spikeCount, platformStart, finishX) {
    let objs = [];

    // ground spikes row (1–3 long, repeated spikeCount times)
    for (let i = 0; i < spikeCount; i++) {
        const count = Math.floor(Math.random() * 3) + 1;
        const offset = Math.floor(Math.random() * 200);
        const baseX = spikeStart + i * 400 + offset;

        for (let j = 0; j < count; j++) {
            objs.push({
                x: baseX + j * 40,
                y: 330,
                w: 40,
                h: 40,
                type: "spike"
            });
        }

        // platform in front of each spike row
        const platformY = Math.floor(Math.random() * 3) * 40 + 200;
        const platformWidth = Math.floor(Math.random() * 4) + 2;
        const platX = baseX + count * 40 + 120;

        for (let k = 0; k < platformWidth; k++) {
            objs.push({
                x: platX + k * 40,
                y: platformY,
                w: 40,
                h: 40,
                type: "platform"
            });
        }

        const spikeOnPlatCount = Math.floor(Math.random() * 3) + 1;
        for (let s = 0; s < spikeOnPlatCount; s++) {
            objs.push({
                x: platX + s * 40,
                y: platformY - 40,
                w: 40,
                h: 40,
                type: "spike"
            });
        }
    }

    // extra platform section
    const pY = Math.floor(Math.random() * 3) * 40 + 200;
    const pW = Math.floor(Math.random() * 4) + 3;
    for (let i = 0; i < pW; i++) {
        objs.push({
            x: platformStart + i * 40,
            y: pY,
            w: 40,
            h: 40,
            type: "platform"
        });
    }

    // finish line
    objs.push({ x: finishX, y: 200, w: 20, h: 200, type: "finish" });

    return objs;
}

// 10 levels with different spacing
levels.push(makeLevel(1200, 3, 2200, 3200));  // Level 1
levels.push(makeLevel(1300, 4, 2400, 3600));  // Level 2
levels.push(makeLevel(1400, 4, 2600, 3800));  // Level 3
levels.push(makeLevel(1500, 5, 2800, 4000));  // Level 4
levels.push(makeLevel(1600, 5, 3000, 4200));  // Level 5
levels.push(makeLevel(1700, 6, 3200, 4400));  // Level 6
levels.push(makeLevel(1800, 6, 3400, 4600));  // Level 7
levels.push(makeLevel(1900, 7, 3600, 4800));  // Level 8
levels.push(makeLevel(2000, 7, 3800, 5000));  // Level 9
levels.push(makeLevel(2100, 8, 4000, 5200));  // Level 10

/* ---------------- LEVEL LOADING ---------------- */

function loadLevel(index) {
    currentLevel = index % levels.length;

    player = {
        x: 100,
        y: 330,
        w: 30,
        h: 30,
        dy: 0,
        grounded: true
    };

    demon = {
        x: -20,
        y: 330,
        w: 40,
        h: 40,
        speed: 2
    };

    objects = JSON.parse(JSON.stringify(levels[currentLevel]));
}

/* ---------------- INPUT ---------------- */

document.addEventListener("keydown", (e) => {
    if (e.code === "Space" && player.grounded) {
        player.dy = -14;
        player.grounded = false;
    }
});

/* ---------------- GAME LOOP ---------------- */

function loop() {
    ctx.clearRect(0,0,canvas.width,canvas.height);

    // physics
    player.dy += 0.4;
    player.y += player.dy;

    if (player.y >= 330) {
        player.y = 330;
        player.dy = 0;
        player.grounded = true;
    }

    // movement
    player.x += 4;
    demon.x += demon.speed;

    let camX = player.x - 100;

    // player
    ctx.fillStyle = "#4af";
    ctx.fillRect(player.x - camX, player.y, player.w, player.h);

    // demon
    ctx.fillStyle = "#f33";
    ctx.fillRect(demon.x - camX, demon.y, demon.w, demon.h);

    // objects
    objects.forEach(o => {

        // platform
        if (o.type === "platform") {
            ctx.fillStyle = "#888";
            ctx.fillRect(o.x - camX, o.y, o.w, o.h);

            if (player.x < o.x + o.w &&
                player.x + player.w > o.x &&
                player.y + player.h > o.y &&
                player.y + player.h < o.y + 20 &&
                player.dy > 0) {

                player.y = o.y - player.h;
                player.dy = 0;
                player.grounded = true;
            }

            return;
        }

        // spikes (white tip + red base)
        if (o.type === "spike") {
            // white tip
            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.moveTo(o.x - camX + o.w/2, o.y);
            ctx.lineTo(o.x - camX + o.w*0.25, o.y + o.h*0.4);
            ctx.lineTo(o.x - camX + o.w*0.75, o.y + o.h*0.4);
            ctx.closePath();
            ctx.fill();

            // red base
            ctx.fillStyle = "#ff0000";
            ctx.beginPath();
            ctx.moveTo(o.x - camX + o.w*0.25, o.y + o.h*0.4);
            ctx.lineTo(o.x - camX, o.y + o.h);
            ctx.lineTo(o.x - camX + o.w, o.y + o.h);
            ctx.lineTo(o.x - camX + o.w*0.75, o.y + o.h*0.4);
            ctx.closePath();
            ctx.fill();

            // collision
            if (player.x < o.x + o.w &&
                player.x + player.w > o.x &&
                player.y + player.h > o.y &&
                player.y < o.y + o.h) {

                demon.speed += 0.1;
                restartLevel();
            }

            return;
        }

        // finish line
        if (o.type === "finish") ctx.fillStyle = "#fff";

        ctx.fillRect(o.x - camX, o.y, o.w, o.h);

        if (o.type === "finish") {
            if (player.x < o.x + o.w &&
                player.x + player.w > o.x &&
                player.y < o.y + o.h &&
                player.y + player.h > o.y) {

                nextLevel();
            }
        }
    });

    if (demon.x + demon.w >= player.x) {
        restartLevel();
    }

    requestAnimationFrame(loop);
}

/* ---------------- LEVEL CONTROL ---------------- */

function restartLevel() {
    loadLevel(currentLevel);
}

function nextLevel() {
    loadLevel(currentLevel + 1);
}

/* ---------------- START ---------------- */

loadLevel(0);
loop();
</script>
</body>
</html>
