<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Chase Dash</title>
<style>
    body { margin:0; background:#111; overflow:hidden; }
    canvas { background:#222; display:block; margin:0 auto; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
canvas.width = 900;
canvas.height = 400;

// PLAYER
let player = {
    x: 100,
    y: 300,
    w: 30,
    h: 30,
    dy: 0,
    grounded: true
};

// CHASER (Cube Demon)
let demon = {
    x: -20,
    y: 300,
    w: 40,
    h: 40,
    speed: 2
};

// LEVEL OBJECTS
let objects = [
    {x:300, y:330, w:40, h:40, type:"spike"},
    {x:450, y:330, w:40, h:40, type:"spike"},
    {x:650, y:330, w:40, h:40, type:"spike"},
    {x:800, y:330, w:40, h:40, type:"spike"},
    {x:950, y:330, w:40, h:40, type:"spike"},
    {x:1100, y:330, w:40, h:40, type:"spike"},
    {x:1300, y:330, w:40, h:40, type:"spike"},
    {x:1500, y:330, w:40, h:40, type:"spike"},
    {x:1700, y:330, w:40, h:40, type:"spike"},
    {x:2000, y:330, w:40, h:40, type:"spike"}
];

// GAME SPEED
let speed = 2;

// INPUT — SPACE to jump
document.addEventListener("keydown", (e) => {
    if (e.code === "Space" && player.grounded) {
        player.dy = -10;
        player.grounded = false;
    }
});

// GAME LOOP
function loop() {
    ctx.clearRect(0,0,canvas.width,canvas.height);

    // Player physics
    player.dy += 0.5;
    player.y += player.dy;

    if (player.y >= 300) {
        player.y = 300;
        player.dy = 0;
        player.grounded = true;
    }

    // Player moves forward
    player.x += speed;

    // Demon chases player
    demon.x += demon.speed;

    // CAMERA FOLLOW
    let camX = player.x - 100;

    // Draw player
    ctx.fillStyle = "#4af";
    ctx.fillRect(player.x - camX, player.y, player.w, player.h);

    // Draw demon
    ctx.fillStyle = "#f33";
    ctx.fillRect(demon.x - camX, demon.y, demon.w, demon.h);

    // Draw objects + interactions
    objects.forEach(o => {
        ctx.fillStyle = "#f00"; // spikes always red
        ctx.fillRect(o.x - camX, o.y, o.w, o.h);

        // Collision
        if (player.x < o.x + o.w &&
            player.x + player.w > o.x &&
            player.y < o.y + o.h &&
            player.y + player.h > o.y) {

            demon.speed += 0.1;   // demon gets faster by .1 ONLY on spikes
            end("You hit a spike!");
        }
    });

    // Demon catches player
    if (demon.x + demon.w >= player.x) {
        end("Cube Demon caught you!");
    }

    // Restart when player reaches screen edge
    if (player.x - camX >= canvas.width - player.w) {
        end("You reached the edge!");
    }

    requestAnimationFrame(loop);
}

function end(msg) {
    alert(msg);
    location.reload();
}

loop();
</script>
</body>
</html>
