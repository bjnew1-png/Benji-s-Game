<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cube Dash – 10 Levels</title>
<style>
    body { margin:0; background:#111; overflow:hidden; }
    canvas { background:#222; display:block; margin:0 auto; }
    #loadingScreen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #000;
        color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 60px;
        font-family: Arial, sans-serif;
        z-index: 9999;
        opacity: 1;
        transition: opacity 1s ease;
    }
</style>
</head>
<body>

<div id="loadingScreen"><h1>Cube Dash</h1></div>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
canvas.width = 900;
canvas.height = 400;

window.onload = () => {
    setTimeout(() => {
        const load = document.getElementById("loadingScreen");
        load.style.opacity = 0;
        setTimeout(() => load.style.display = "none", 1000);
    }, 1500);
};

let player;
let demon;
let objects = [];
let currentLevel = 0;
let levels = [];

/* ---------------------------------------------------
   LEVEL GENERATOR — SPIKES BEHIND PLATFORMS (3–5 BLOCKS AWAY)
--------------------------------------------------- */

function makeLevel(spikeStart, spikeCount, finishX) {
    let objs = [];

    for (let i = 0; i < spikeCount; i++) {

        // 1–3 spikes long
        const count = Math.floor(Math.random() * 3) + 1;
        const offset = Math.floor(Math.random() * 200);
        const baseX = spikeStart + i * 400 + offset;

        // Ground spikes
        for (let j = 0; j < count; j++) {
            objs.push({
                x: baseX + j * 40,
                y: 330,
                w: 40,
                h: 40,
                type: "spike"
            });
        }

        // PLATFORM 3–5 blocks AFTER spikes
        const platformOffset = (Math.floor(Math.random() * 3) + 3) * 40;
        const platformX = baseX + count * 40 + platformOffset;
        const platformY = Math.floor(Math.random() * 3) * 40 + 200;
        const platformWidth = Math.floor(Math.random() * 3) + 2;

        for (let p = 0; p < platformWidth; p++) {
            objs.push({
                x: platformX + p * 40,
                y: platformY,
                w: 40,
                h: 40,
                type: "platform"
            });
        }

        // SPIKES BEHIND PLATFORM (3–5 blocks away)
        const spikeBehindOffset = (Math.floor(Math.random() * 3) + 3) * 40;
        const spikeBehindX = platformX + platformWidth * 40 + spikeBehindOffset;
        const spikeBehindCount = Math.floor(Math.random() * 3) + 1;

        for (let s = 0; s < spikeBehindCount; s++) {
            objs.push({
                x: spikeBehindX + s * 40,
                y: 330,
                w: 40,
                h: 40,
                type: "spike"
            });
        }
    }

    // Finish line
    objs.push({ x: finishX, y: 200, w: 20, h: 200, type: "finish" });

    return objs;
}

/* ---------------------------------------------------
   10 LEVELS
--------------------------------------------------- */

levels.push(makeLevel(1200, 3, 3200));
levels.push(makeLevel(1300, 4, 3600));
levels.push(makeLevel(1400, 4, 3800));
levels.push(makeLevel(1500, 5, 4000));
levels.push(makeLevel(1600, 5, 4200));
levels.push(makeLevel(1700, 6, 4400));
levels.push(makeLevel(1800, 6, 4600));
levels.push(makeLevel(1900, 7, 4800));
levels.push(makeLevel(2000, 7, 5000));
levels.push(makeLevel(2100, 8, 5200));

/* ---------------------------------------------------
   LOAD LEVEL
--------------------------------------------------- */

function loadLevel(index) {
    currentLevel = index % levels.length;

    player = {
        x: 100,
        y: 330,
        w: 30,
        h: 30,
        dy: 0,
        grounded: true
    };

    demon = {
        x: -20,
        y: 330,
        w: 40,
        h: 40,
        speed: 2
    };

    objects = JSON.parse(JSON.stringify(levels[currentLevel]));
}

/* ---------------------------------------------------
   INPUT
--------------------------------------------------- */

document.addEventListener("keydown", (e) => {
    if (e.code === "Space" && player.grounded) {
        player.dy = -14;
        player.grounded = false;
    }
});

/* ---------------------------------------------------
   GAME LOOP
--------------------------------------------------- */

function loop() {
    ctx.clearRect(0,0,canvas.width,canvas.height);

    player.dy += 0.4;
    player.y += player.dy;

    if (player.y >= 330) {
        player.y = 330;
        player.dy = 0;
        player.grounded = true;
    }

    player.x += 4;
    demon.x += demon.speed;

    let camX = player.x - 100;

    ctx.fillStyle = "#4af";
    ctx.fillRect(player.x - camX, player.y, player.w, player.h);

    ctx.fillStyle = "#f33";
    ctx.fillRect(demon.x - camX, demon.y, demon.w, demon.h);

    objects.forEach(o => {

        /* ---------------------------------------------------
           PLATFORM COLLISION — NEW RULES
           ✔ Stand on top
           ✔ Die if you hit bottom
           ✔ Die if you hit sides
        --------------------------------------------------- */
        if (o.type === "platform") {
            ctx.fillStyle = "#888";
            ctx.fillRect(o.x - camX, o.y, o.w, o.h);

            const px = player.x;
            const py = player.y;
            const pw = player.w;
            const ph = player.h;

            const ox = o.x;
            const oy = o.y;
            const ow = o.w;
            const oh = o.h;

            // LAND ON TOP (safe)
            if (px < ox + ow &&
                px + pw > ox &&
                py + ph > oy &&
                py + ph < oy + 20 &&
                player.dy > 0) {

                player.y = oy - ph;
                player.dy = 0;
                player.grounded = true;
                return;
            }

            // HIT BOTTOM OR SIDES (die)
            if (px < ox + ow &&
                px + pw > ox &&
                py < oy + oh &&
                py + ph > oy) {

                restartLevel();
            }

            return;
        }

        /* ---------------------------------------------------
           SPIKES — WHITE TIP + RED BASE
        --------------------------------------------------- */
        if (o.type === "spike") {

            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.moveTo(o.x - camX + o.w/2, o.y);
            ctx.lineTo(o.x - camX + o.w*0.25, o.y + o.h*0.4);
            ctx.lineTo(o.x - camX + o.w*0.75, o.y + o.h*0.4);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = "#ff0000";
            ctx.beginPath();
            ctx.moveTo(o.x - camX + o.w*0.25, o.y + o.h*0.4);
            ctx.lineTo(o.x - camX, o.y + o.h);
            ctx.lineTo(o.x - camX + o.w, o.y + o.h);
            ctx.lineTo(o.x - camX + o.w*0.75, o.y + o.h*0.4);
            ctx.closePath();
            ctx.fill();

            if (player.x < o.x + o.w &&
                player.x + player.w > o.x &&
                player.y + player.h > o.y &&
                player.y < o.y + o.h) {
                restartLevel();
            }

            return;
        }

        /* ---------------------------------------------------
           FINISH LINE
        --------------------------------------------------- */
        if (o.type === "finish") ctx.fillStyle = "#fff";

        ctx.fillRect(o.x - camX, o.y, o.w, o.h);

        if (o.type === "finish") {
            if (player.x < o.x + o.w &&
                player.x + player.w > o.x &&
                player.y < o.y + o.h &&
                player.y + player.h > o.y) {
                nextLevel();
            }
        }
    });

    if (demon.x + demon.w >= player.x) {
        restartLevel();
    }

    requestAnimationFrame(loop);
}

/* ---------------------------------------------------
   LEVEL CONTROL
--------------------------------------------------- */

function restartLevel() {
    loadLevel(currentLevel);
}

function nextLevel() {
    loadLevel(currentLevel + 1);
}

/* ---------------------------------------------------
   START GAME
--------------------------------------------------- */

loadLevel(0);
loop();
</script>
</body>
</html>
