<!DOCTYPE html>
<html>
<head>
<title>Woodshop Warrior – Multi Level</title>
<style>
  body {
    margin:0;
    background:#1b1b1f;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:sans-serif;
  }
  canvas {
    background:linear-gradient(#f7e3c2, #e0c08f);
    box-shadow:0 0 35px rgba(0,0,0,0.8);
    border:4px solid #4a2b12;
    border-radius:10px;
  }
</style>
</head>
<body>
<canvas id="game" width="800" height="500"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let levelIndex = 0;

const levels = [
  {
    name: "Level 1 – Rookie Carpenter",
    time: 45,
    rageMax: 100,
    finish: { x: 640, y: 360, w: 100, h: 80 },
    tools: [
      { name:"clamp", x:140, y:110, w:60, h:16, vx:2.0, vy:0 },
      { name:"sander", x:560, y:320, w:80, h:18, vx:-2.5, vy:0 },
      { name:"glue", x:380, y:70, w:40, h:40, vx:0, vy:2.0 }
    ]
  },
  {
    name: "Level 2 – Chaos Apprentice",
    time: 40,
    rageMax: 90,
    finish: { x: 80, y: 60, w: 120, h: 70 },
    tools: [
      { name:"clamp", x:200, y:140, w:70, h:18, vx:3.0, vy:0 },
      { name:"sander", x:600, y:340, w:90, h:20, vx:-3.5, vy:0 },
      { name:"glue", x:420, y:90, w:45, h:45, vx:0, vy:3.0 },
      { name:"chisel", x:300, y:380, w:50, h:12, vx:2.2, vy:-1.5 }
    ]
  },
  {
    name: "Level 3 – Workshop Warrior",
    time: 35,
    rageMax: 80,
    finish: { x: 620, y: 80, w: 120, h: 80 },
    tools: [
      { name:"clamp", x:160, y:120, w:70, h:18, vx:3.5, vy:0 },
      { name:"sander", x:620, y:360, w:100, h:22, vx:-4.0, vy:0 },
      { name:"glue", x:420, y:90, w:45, h:45, vx:0, vy:3.5 },
      { name:"chisel", x:260, y:380, w:55, h:14, vx:2.8, vy:-2.0 },
      { name:"mallet", x:500, y:200, w:40, h:40, vx:-2.5, vy:2.5 }
    ]
  }
];

let project;
let tools;
let finishZone;
let rage;
let timeLeft;
let last = performance.now();
let keys = {};
let gameOver = false;
let win = false;
let allCleared = false;

const bounds = { minX:70, minY:60, maxX:730, maxY:430 };

function startLevel(index){
  const lvl = levels[index];
  project = { x:380, y:230, w:60, h:80, vx:0, vy:0 };
  tools = JSON.parse(JSON.stringify(lvl.tools));
  finishZone = lvl.finish;
  rage = 0;
  timeLeft = lvl.time;
  gameOver = false;
  win = false;
  allCleared = false;
}

startLevel(levelIndex);

window.addEventListener("keydown", e => {
  keys[e.key] = true;
  if(gameOver && e.key === "Enter"){
    if(win && levelIndex < levels.length - 1){
      levelIndex++;
      startLevel(levelIndex);
    } else if(!win || levelIndex === levels.length - 1){
      levelIndex = 0;
      startLevel(levelIndex);
    }
  }
});
window.addEventListener("keyup", e => keys[e.key] = false);

function update(dt){
  if(gameOver) return;

  timeLeft -= dt;
  if(timeLeft <= 0){
    gameOver = true;
    win = false;
  }

  const speed = 190;
  project.vx = (keys["ArrowLeft"] ? -speed : keys["ArrowRight"] ? speed : 0);
  project.vy = (keys["ArrowUp"] ? -speed : keys["ArrowDown"] ? speed : 0);

  project.x += project.vx * dt;
  project.y += project.vy * dt;

  if(project.x < bounds.minX){ project.x = bounds.minX; rage += 1.5; }
  if(project.x + project.w > bounds.maxX){ project.x = bounds.maxX - project.w; rage += 1.5; }
  if(project.y < bounds.minY){ project.y = bounds.minY; rage += 1.5; }
  if(project.y + project.h > bounds.maxY){ project.y = bounds.maxY - project.h; rage += 1.5; }

  project.x += Math.sin(performance.now()/260) * 14 * dt;

  for(let t of tools){
    t.x += t.vx;
    t.y += t.vy;

    if(t.x < bounds.minX || t.x + t.w > bounds.maxX) t.vx *= -1;
    if(t.y < bounds.minY || t.y + t.h > bounds.maxY) t.vy *= -1;

    if(collide(project, t)){
      rage += 10;
      project.x += (project.x < t.x ? -30 : 30);
      project.y += (project.y < t.y ? -30 : 30);
    }
  }

  const lvl = levels[levelIndex];
  if(rage >= lvl.rageMax){
    gameOver = true;
    win = false;
  }

  if(collide(project, finishZone) && rage < lvl.rageMax){
    gameOver = true;
    win = true;
    if(levelIndex === levels.length - 1){
      allCleared = true;
    }
  }
}

function collide(a,b){
  return a.x < b.x + b.w &&
         a.x + a.w > b.x &&
         a.y < b.y + b.h &&
         a.y + a.h > b.y;
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle = "#d9b47a";
  ctx.fillRect(bounds.minX, bounds.minY, bounds.maxX - bounds.minX, bounds.maxY - bounds.minY);

  ctx.fillStyle = "#3b2a18";
  ctx.fillRect(bounds.minX-10, bounds.minY-10, bounds.maxX-bounds.minX+20, bounds.maxY-bounds.minY+20);

  ctx.fillStyle = "#f0d9b0";
  ctx.fillRect(bounds.minX, bounds.minY, bounds.maxX - bounds.minX, bounds.maxY - bounds.minY);

  ctx.fillStyle = "#8fd48f";
  ctx.fillRect(finishZone.x, finishZone.y, finishZone.w, finishZone.h);
  ctx.fillStyle = "#1f3f1a";
  ctx.font = "18px sans-serif";
  ctx.fillText("FINISH", finishZone.x + 20, finishZone.y + finishZone.h/2);

  ctx.save();
  ctx.shadowColor = "rgba(0,0,0,0.5)";
  ctx.shadowBlur = 12;
  ctx.fillStyle = "#c48a4a";
  ctx.fillRect(project.x, project.y, project.w, project.h);
  ctx.restore();
  ctx.strokeStyle = "#7a4b1c";
  ctx.lineWidth = 2;
  ctx.strokeRect(project.x, project.y, project.w, project.h);

  for(let t of tools){
    ctx.save();
    ctx.shadowColor = "rgba(0,0,0,0.4)";
    ctx.shadowBlur = 8;
    if(t.name === "clamp") ctx.fillStyle = "#b00000";
    else if(t.name === "sander") ctx.fillStyle = "#444";
    else if(t.name === "glue") ctx.fillStyle = "#ffd54f";
    else if(t.name === "chisel") ctx.fillStyle = "#c0c0c0";
    else if(t.name === "mallet") ctx.fillStyle = "#5a3b1e";
    else ctx.fillStyle = "#333";
    ctx.fillRect(t.x, t.y, t.w, t.h);
    ctx.restore();
  }

  ctx.fillStyle = "#ffffff";
  ctx.font = "20px sans-serif";
  ctx.fillText("Rage: " + Math.floor(rage) + "/" + levels[levelIndex].rageMax, 80, 40);
  ctx.fillText("Time: " + Math.max(0,timeLeft).toFixed(1) + "s", 320, 40);
  ctx.fillText(levels[levelIndex].name, 80, 470);

  let barX = 80, barY = 50, barW = 220, barH = 10;
  ctx.fillStyle = "#333";
  ctx.fillRect(barX, barY, barW, barH);
  let rageRatio = Math.min(rage / levels[levelIndex].rageMax, 1);
  ctx.fillStyle = rageRatio < 0.5 ? "#4caf50" : rageRatio < 0.8 ? "#ff9800" : "#f44336";
  ctx.fillRect(barX, barY, barW * rageRatio, barH);

  if(gameOver){
    ctx.fillStyle = "rgba(0,0,0,0.7)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle = "#fff";
    ctx.font = "32px sans-serif";
    if(win){
      if(allCleared){
        ctx.fillText("YOU ARE THE WOODSHOP WARRIOR!", 120, 220);
        ctx.font = "20px sans-serif";
        ctx.fillText("You cleared all levels without letting rage win.", 160, 260);
      } else {
        ctx.fillText("LEVEL CLEARED!", 260, 220);
        ctx.font = "20px sans-serif";
        ctx.fillText("Press ENTER to tackle the next level.", 210, 260);
      }
    } else {
      ctx.fillText("WORKBENCH RAGE OVERLOAD!", 160, 220);
      ctx.font = "20px sans-serif";
      ctx.fillText("Press ENTER to retry from Level 1.", 210, 260);
    }
  }
}

function loop(now){
  let dt = (now - last) / 1000;
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
