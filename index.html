<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cube Dash</title>
<style>
    body { margin:0; background:#111; overflow:hidden; }
    canvas { background:#222; display:block; margin:0 auto; }

    #loadingScreen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #000;
        color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 60px;
        font-family: Arial, sans-serif;
        z-index: 9999;
        opacity: 1;
        transition: opacity 1s ease;
    }
</style>
</head>
<body>

<div id="loadingScreen"><h1>Cube Dash</h1></div>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
canvas.width = 900;
canvas.height = 400;

// LOADING SCREEN FADE
setTimeout(() => {
    const load = document.getElementById("loadingScreen");
    load.style.opacity = 0;
    setTimeout(() => load.style.display = "none", 1000);
}, 2000);

// PLAYER
let player = {
    x: 100,
    y: 330,   // SAME HEIGHT AS SPIKES
    w: 30,
    h: 30,
    dy: 0,
    grounded: true
};

// DEMON
let demon = {
    x: -20,
    y: 330,
    w: 40,
    h: 40,
    speed: 2
};

// OBJECT LIST
let objects = [];

/* ---------------------------------------------------
   RANDOM SPIKE ROWS (1–3 spikes long)
   + RANDOM PLATFORMS WITH SPIKES ON THEM
--------------------------------------------------- */

function addSpikeRow(startX) {
    const count = Math.floor(Math.random() * 3) + 1; // 1–3 spikes
    const offset = Math.floor(Math.random() * 200);

    for (let i = 0; i < count; i++) {
        objects.push({
            x: startX + offset + i * 40,
            y: 330,
            w: 40,
            h: 40,
            type: "spike"
        });
    }
}

function addPlatformWithSpikes(startX) {
    const platformY = Math.floor(Math.random() * 3) * 40 + 200; // 200–280 height
    const platformWidth = Math.floor(Math.random() * 4) + 2; // 2–5 blocks

    // Platform blocks
    for (let i = 0; i < platformWidth; i++) {
        objects.push({
            x: startX + i * 40,
            y: platformY,
            w: 40,
            h: 40,
            type: "platform"
        });
    }

    // Spikes on top of platform
    const spikeCount = Math.floor(Math.random() * 3) + 1; // 1–3 spikes
    for (let i = 0; i < spikeCount; i++) {
        objects.push({
            x: startX + i * 40,
            y: platformY - 40,
            w: 40,
            h: 40,
            type: "spike"
        });
    }
}

// PLACE RANDOM SPIKES + PLATFORMS
addSpikeRow(1500);
addPlatformWithSpikes(1800);
addSpikeRow(2200);
addPlatformWithSpikes(2500);
addSpikeRow(3000);
addPlatformWithSpikes(3300);
addSpikeRow(3800);

// FINISH LINE
objects.push({ x: 4500, y: 200, w: 20, h: 200, type: "finish" });

/* ---------------------------------------------------
   INPUT
--------------------------------------------------- */

document.addEventListener("keydown", (e) => {
    if (e.code === "Space" && player.grounded) {
        player.dy = -14;   // HIGHER JUMP
        player.grounded = false;
    }
});

/* ---------------------------------------------------
   GAME LOOP
--------------------------------------------------- */

function loop() {

    ctx.clearRect(0,0,canvas.width,canvas.height);

    // Physics
    player.dy += 0.4;   // LONGER JUMP
    player.y += player.dy;
