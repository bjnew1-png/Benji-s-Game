  }
  canvas {

    border:4px solid #4a2b12;
    border-radius:10px;
  }
</style>
</head>
<body>

<canvas id="game" width="1200" height="700"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// ⭐ SMALLER PLAYER
let player = { x:120, y:120, w:20, h:28, vx:0, vy:0 };

// ⭐ FINISH IN MIDDLE (with a real gap)
const finishZone = { x:560, y:310, w:80, h:80 };

// ⭐ COMPLEX MAZE WALLS (solid, dark color)
const walls = [

  {x:80, y:80, w:1040, h:20},
  {x:80, y:80, w:20,   h:540},
  {x:1100, y:80, w:20, h:540},
  {x:80, y:600, w:1040, h:20},

  // Complex maze layout
  {x:160, y:140, w:300, h:20},
  {x:160, y:140, w:20,  h:260},
  {x:440, y:140, w:20,  h:260},

  {x:220, y:260, w:240, h:20},
  {x:220, y:260, w:20,  h:260},
  {x:440, y:260, w:20,  h:260},

  {x:520, y:140, w:360, h:20},
  {x:520, y:140, w:20,  h:260},
  {x:860, y:140, w:20,  h:260},

  {x:580, y:260, w:300, h:20},
  {x:580, y:260, w:20,  h:260},
  {x:860, y:260, w:20,  h:260},

  // Lower maze expansion
  {x:160, y:420, w:300, h:20},
  {x:160, y:420, w:20,  h:180},
  {x:440, y:420, w:20,  h:180},

  {x:520, y:420, w:360, h:20},
  {x:520, y:420, w:20,  h:180},
  {x:860, y:420, w:20,  h:180},

  // ⭐ CENTER RING — now with a gap on the LEFT
  {x:640, y:320, w:20,  h:160},  // right pillar
  {x:520, y:320, w:20,  h:160},  // left pillar

  // ⭐ OPEN GAP to reach finish
  // Removed top and bottom bars entirely

  // Extra dead ends for complexity
  {x:260, y:500, w:200, h:20},
  {x:260, y:540, w:20,  h:60},

  {x:760, y:500, w:200, h:20},
  {x:940, y:540, w:20,  h:60}
];

// INPUT
let keys = {};
window.addEventListener("keydown", e => keys[e.key] = true);
window.addEventListener("keyup", e => keys[e.key] = false);

// COLLISION CHECK
function hitsWall(x,y,w,h){
  for(const wall of walls){
    if(x < wall.x + wall.w &&
       x + w > wall.x &&
       y < wall.y + wall.h &&
       y + h > wall.y){
      return true;
    }
  }
  return false;
}

// UPDATE LOOP
function update(dt){
  const speed = 260;

  let vx = (keys["ArrowLeft"] ? -speed : keys["ArrowRight"] ? speed : 0);
  let vy = (keys["ArrowUp"] ? -speed : keys["ArrowDown"] ? speed : 0);

  // Try X movement
  let nextX = player.x + vx * dt;
  if(!hitsWall(nextX, player.y, player.w, player.h)){
    player.x = nextX;
  }

  // Try Y movement
  let nextY = player.y + vy * dt;
  if(!hitsWall(player.x, nextY, player.w, player.h)){
    player.y = nextY;
  }
}

// DRAW LOOP
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // Maze background (floor)
  ctx.fillStyle = "#d9b47a";
  ctx.fillRect(80,80,1040,520);

  // Maze walls (dark brown)
  ctx.fillStyle = "#3b2a18";
  for(const wall of walls){
    ctx.fillRect(wall.x, wall.y, wall.w, wall.h);
  }

  // Finish zone (reachable now)
  ctx.fillStyle = "#8fd48f";
  ctx.fillRect(finishZone.x, finishZone.y, finishZone.w, finishZone.h);
